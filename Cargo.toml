[workspace]
resolver = "2"
members = ["crates/editor-core", "crates/editor-media", "crates/editor-app"]
default-members = ["crates/editor-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Meridian Contributors"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
