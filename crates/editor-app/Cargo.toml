[package]
name = "editor-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Meridian desktop non-linear editor"
publish = false

[[bin]]
name = "meridian"
path = "src/main.rs"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
editor-core = { path = "../editor-core" }
editor-media = { path = "../editor-media" }
serde_json = { workspace = true }
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
rodio = { version = "0.22", optional = true, default-features = false, features = ["playback"] }

[features]
default = []
ffmpeg = ["editor-media/ffmpeg", "dep:rodio"]
